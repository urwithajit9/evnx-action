name: "evnx — .env Security & Validation"
description: >
  Validate, scan, diff, and doctor your .env files in CI.
  Catches secrets, placeholder values, misconfigs, and
  .env/.env.example drift — before they ship.
author: "urwithajit9"

branding:
  icon: "shield"
  color: "green"

inputs:
  command:
    description: >
      evnx command to run.
      One of: scan | validate | diff | doctor | convert | sync
    required: false
    default: "scan"

  path:
    description: "Directory or file to operate on."
    required: false
    default: "."

  format:
    description: >
      Output format.
      scan supports:  pretty | json | sarif | github
      validate supports: pretty | json | github-actions
      diff supports:  pretty | json
    required: false
    default: "github"

  strict:
    description: >
      Exit 1 on warnings (not just errors).
      Applies to: validate, scan.
    required: false
    default: "false"

  exit_zero:
    description: >
      Report findings but always exit 0.
      Useful when you want annotations without blocking the PR.
    required: false
    default: "false"

  env_file:
    description: "Path to the .env file (for validate / diff / scan)."
    required: false
    default: ".env"

  example_file:
    description: "Path to the .env.example file (for diff / sync)."
    required: false
    default: ".env.example"

  convert_to:
    description: >
      Target format for the convert command.
      Supported: json | yaml | shell | docker-compose | kubernetes |
      terraform | github-actions | aws-secrets | gcp-secrets |
      azure-keyvault | heroku | vercel | railway | doppler
    required: false
    default: "json"

  convert_output:
    description: "Output file path for the convert command."
    required: false
    default: ""

  version:
    description: >
      evnx version to install.
      Defaults to the latest release.
    required: false
    default: "latest"

outputs:
  findings:
    description: "Number of findings (secrets / errors) detected."
    value: ${{ steps.run-evnx.outputs.findings }}

  result:
    description: "Raw text output from the evnx command."
    value: ${{ steps.run-evnx.outputs.result }}

  exit_code:
    description: "Exit code returned by evnx."
    value: ${{ steps.run-evnx.outputs.exit_code }}

runs:
  using: "composite"
  steps:
    - name: Install evnx
      shell: bash
      run: |
        set -e
        if ! command -v evnx &>/dev/null; then
          echo "::group::Installing evnx"
          if [ "${{ inputs.version }}" = "latest" ]; then
            curl -fsSL https://dotenv.space/install.sh | bash
          else
            curl -fsSL "https://github.com/urwithajit9/evnx/releases/download/${{ inputs.version }}/evnx-linux-x86_64" \
              -o /usr/local/bin/evnx && chmod +x /usr/local/bin/evnx
          fi
          echo "::endgroup::"
        fi
        echo "evnx $(evnx --version) ready"

    - name: Run evnx ${{ inputs.command }}
      id: run-evnx
      shell: bash
      run: |
        set -euo pipefail

        CMD="${{ inputs.command }}"
        FORMAT="${{ inputs.format }}"
        STRICT="${{ inputs.strict }}"
        EXIT_ZERO="${{ inputs.exit_zero }}"
        ENV_FILE="${{ inputs.env_file }}"
        EXAMPLE_FILE="${{ inputs.example_file }}"
        PATH_ARG="${{ inputs.path }}"
        CONVERT_TO="${{ inputs.convert_to }}"
        CONVERT_OUTPUT="${{ inputs.convert_output }}"

        build_flags() {
          FLAGS=""
          case "$CMD" in
            scan)
              [ -n "$PATH_ARG" ] && [ "$PATH_ARG" != "." ] && FLAGS="$FLAGS --path $PATH_ARG"
              FLAGS="$FLAGS --format $FORMAT"
              [ "$EXIT_ZERO" = "true" ] && FLAGS="$FLAGS --exit-zero"
              ;;
            validate)
              [ "$ENV_FILE" != ".env" ] && FLAGS="$FLAGS --file $ENV_FILE"
              FLAGS="$FLAGS --format $FORMAT"
              [ "$STRICT" = "true" ] && FLAGS="$FLAGS --strict"
              [ "$EXIT_ZERO" = "true" ] && FLAGS="$FLAGS --exit-zero"
              ;;
            diff)
              FLAGS="$FLAGS --format $FORMAT"
              ;;
            doctor)
              [ "$PATH_ARG" != "." ] && FLAGS="$FLAGS --path $PATH_ARG"
              ;;
            convert)
              FLAGS="$FLAGS --to $CONVERT_TO"
              [ -n "$CONVERT_OUTPUT" ] && FLAGS="$FLAGS --output $CONVERT_OUTPUT"
              ;;
            sync)
              ;;
          esac
          echo "$FLAGS"
        }

        FLAGS=$(build_flags)
        echo "::group::evnx $CMD $FLAGS"

        # Capture output, preserve exit code
        set +e
        OUTPUT=$(evnx "$CMD" $FLAGS 2>&1)
        CODE=$?
        set -e

        echo "$OUTPUT"
        echo "::endgroup::"

        # Surface findings count from JSON when format=json
        FINDINGS=0
        if echo "$OUTPUT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(len(d.get('findings', d.get('errors', []))))" 2>/dev/null; then
          FINDINGS=$(echo "$OUTPUT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(len(d.get('findings', d.get('errors', []))))" 2>/dev/null || echo 0)
        fi

        # Set outputs
        {
          echo "exit_code=$CODE"
          echo "findings=$FINDINGS"
          echo "result<<EVNX_EOF"
          echo "$OUTPUT"
          echo "EVNX_EOF"
        } >> "$GITHUB_OUTPUT"

        # Respect exit_zero override
        if [ "$EXIT_ZERO" = "true" ]; then
          exit 0
        fi

        exit $CODE
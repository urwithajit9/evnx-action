name: "evnx — .env Security & Validation"
description: >
  Scan, validate and secure .env files in CI — secret detection, misconfig checks and drift alerts.
author: "urwithajit9"

branding:
  icon: "shield"
  color: "green"

inputs:
  command:
    description: >
      evnx command to run.
      One of: scan | validate | diff | doctor | convert | sync
    required: false
    default: "scan"

  path:
    description: "Directory or file to operate on."
    required: false
    default: "."

  format:
    description: >
      Output format.
      scan supports:  pretty | json | sarif | github
      validate supports: pretty | json | github-actions
      diff supports:  pretty | json | patch

      Leave empty to let each command use its own default — one value cannot
      suit three commands that accept three different sets.
    required: false
    default: ""

  strict:
    description: >
      Exit 1 on warnings (not just errors).
      Applies to: validate, scan.
    required: false
    default: "false"

  exit_zero:
    description: >
      Report findings but always exit 0.
      Useful when you want annotations without blocking the PR.
    required: false
    default: "false"

  env_file:
    description: "Path to the .env file (for validate / diff / scan)."
    required: false
    default: ".env"

  example_file:
    description: "Path to the .env.example file (for diff / sync)."
    required: false
    default: ".env.example"

  convert_to:
    description: >
      Target format for the convert command.
      Supported: json | yaml | shell | docker-compose | kubernetes |
      terraform | github-actions | aws-secrets | gcp-secrets |
      azure-keyvault | heroku | vercel | railway | doppler
    required: false
    default: "json"

  convert_output:
    description: "Output file path for the convert command."
    required: false
    default: ""

  version:
    description: >
      evnx CLI version to install, e.g. "v0.9.0" or "0.9.0".
      Defaults to the latest release.

      This is how you pin the CLI. The action's own version is the `uses:` ref
      (@v1), and the two are deliberately separate — pinning one does not pin
      the other.
    required: false
    default: "latest"

outputs:
  findings:
    description: "Number of findings (secrets / errors) detected."
    value: ${{ steps.run-evnx.outputs.findings }}

  result:
    description: "Raw text output from the evnx command."
    value: ${{ steps.run-evnx.outputs.result }}

  exit_code:
    description: "Exit code returned by evnx."
    value: ${{ steps.run-evnx.outputs.exit_code }}

runs:
  using: "composite"
  steps:
    - name: Install evnx
      shell: bash
      run: |
        set -euo pipefail

        VERSION="${{ inputs.version }}"

        # ⚠️ A pin must override an evnx that is already on PATH. The previous
        # version put the whole install behind `if ! command -v evnx`, so on a
        # self-hosted runner — or the second use of this action in one job —
        # `version:` was silently ignored. A pin that does not pin is worse than
        # one that errors.
        if [ "$VERSION" = "latest" ] && command -v evnx >/dev/null 2>&1; then
          echo "evnx already present: $(evnx --version)"
          exit 0
        fi

        echo "::group::Installing evnx ($VERSION)"

        if [ "$VERSION" = "latest" ]; then
          VERSION=$(curl -fsSL https://api.github.com/repos/urwithajit9/evnx/releases/latest \
                    | python3 -c 'import json,sys; print(json.load(sys.stdin)["tag_name"])')
          echo "latest resolves to $VERSION"
        fi

        # Release tags carry the v. Users write it both ways, so accept both
        # rather than 404 on a plausible spelling.
        case "$VERSION" in v*) ;; *) VERSION="v$VERSION" ;; esac

        case "$(uname -m)" in
          x86_64)          TARGET="x86_64-unknown-linux-musl" ;;
          aarch64|arm64)   TARGET="aarch64-unknown-linux-musl" ;;
          *) echo "::error::unsupported runner architecture $(uname -m)"; exit 1 ;;
        esac

        # ⚠️ Releases ship `evnx-<target-triple>.tar.gz`. The previous version
        # fetched `evnx-linux-x86_64`, which has never been a release asset, so
        # every pinned install 404'd.
        ASSET="evnx-${TARGET}.tar.gz"
        BASE="https://github.com/urwithajit9/evnx/releases/download/${VERSION}"

        TMP="$(mktemp -d)"
        trap 'rm -rf "$TMP"' EXIT
        curl -fsSL "${BASE}/${ASSET}"        -o "$TMP/${ASSET}"
        curl -fsSL "${BASE}/${ASSET}.sha256" -o "$TMP/${ASSET}.sha256"

        # ⛔ Verify BEFORE the binary runs. Every release publishes a .sha256 and
        # this action ignored it. Installing an unverified binary into
        # /usr/local/bin is the wrong posture for a tool that sells secret safety.
        ( cd "$TMP" && sha256sum -c "${ASSET}.sha256" )

        tar -xzf "$TMP/${ASSET}" -C "$TMP"

        # ⚠️ The tarball contains `evnx-<target-triple>`, NOT `evnx`. Assuming
        # the plain name fails with a bare "install: No such file or directory"
        # that says nothing about why. Checked against v0.8.0 and v0.9.0; the
        # fallbacks cover a layout change without needing another release to
        # find out.
        BIN="$TMP/evnx-${TARGET}"
        [ -f "$BIN" ] || BIN="$TMP/evnx"
        [ -f "$BIN" ] || BIN="$(find "$TMP" -maxdepth 2 -type f -name 'evnx*' \
                                 ! -name '*.tar.gz' ! -name '*.sha256' | head -1)"
        if [ ! -f "${BIN:-}" ]; then
          echo "::error::no evnx binary inside ${ASSET} — contents: $(tar -tzf "$TMP/${ASSET}" | tr '\n' ' ')"
          exit 1
        fi

        # install(1) rather than `-o /usr/local/bin/evnx`: that directory is
        # root-owned on GitHub runners, so a plain redirect fails.
        sudo install -m 755 "$BIN" /usr/local/bin/evnx

        echo "::endgroup::"
        echo "$(evnx --version) ready"

    - name: Run evnx ${{ inputs.command }}
      id: run-evnx
      shell: bash
      run: |
        set -euo pipefail

        CMD="${{ inputs.command }}"
        FORMAT="${{ inputs.format }}"
        STRICT="${{ inputs.strict }}"
        EXIT_ZERO="${{ inputs.exit_zero }}"
        ENV_FILE="${{ inputs.env_file }}"
        EXAMPLE_FILE="${{ inputs.example_file }}"
        PATH_ARG="${{ inputs.path }}"
        CONVERT_TO="${{ inputs.convert_to }}"
        CONVERT_OUTPUT="${{ inputs.convert_output }}"

        build_flags() {
          FLAGS=""
          # ⚠️ Only when the caller set it. A single default cannot suit three
          # commands that accept three different sets of values.
          fmt() { [ -n "$FORMAT" ] && FLAGS="$FLAGS --format $FORMAT"; }

          case "$CMD" in
            scan)
              fmt
              [ "$EXIT_ZERO" = "true" ] && FLAGS="$FLAGS --exit-zero"
              # ⚠️ `scan` takes a POSITIONAL path. `--path` does not exist and
              # was rejected outright.
              [ -n "$PATH_ARG" ] && [ "$PATH_ARG" != "." ] && FLAGS="$FLAGS $PATH_ARG"
              ;;
            validate)
              # ⚠️ The flag is `--env`, not `--file`.
              [ "$ENV_FILE" != ".env" ] && FLAGS="$FLAGS --env $ENV_FILE"
              [ "$EXAMPLE_FILE" != ".env.example" ] && FLAGS="$FLAGS --example $EXAMPLE_FILE"
              fmt
              [ "$STRICT" = "true" ] && FLAGS="$FLAGS --strict"
              [ "$EXIT_ZERO" = "true" ] && FLAGS="$FLAGS --exit-zero"
              ;;
            diff)
              # ⓘ These inputs were declared and then never used by this branch.
              [ "$ENV_FILE" != ".env" ] && FLAGS="$FLAGS --env $ENV_FILE"
              [ "$EXAMPLE_FILE" != ".env.example" ] && FLAGS="$FLAGS --example $EXAMPLE_FILE"
              # ⚠️ Forced to json: the exit code is unusable (see below), so the
              # result has to be read rather than trusted.
              FLAGS="$FLAGS --format json"
              ;;
            doctor)
              [ "$PATH_ARG" != "." ] && FLAGS="$FLAGS --path $PATH_ARG"
              ;;
            convert)
              FLAGS="$FLAGS --to $CONVERT_TO"
              [ -n "$CONVERT_OUTPUT" ] && FLAGS="$FLAGS --output $CONVERT_OUTPUT"
              ;;
            sync)
              [ "$ENV_FILE" != ".env" ] && FLAGS="$FLAGS --env $ENV_FILE"
              ;;
          esac
          echo "$FLAGS"
        }

        FLAGS=$(build_flags)
        echo "::group::evnx $CMD $FLAGS"

        # ⚠️ stdout and stderr are captured SEPARATELY.
        #
        # The previous version did `OUTPUT=$(evnx … 2>&1)`, which folded the
        # "Docs: https://…" hint evnx writes to stderr into the JSON on stdout.
        # Every parse then failed, so `findings` was silently always 0 and no
        # consumer of the `result` output could read it as JSON.
        ERRFILE="$(mktemp)"
        set +e
        OUTPUT=$(evnx "$CMD" $FLAGS 2>"$ERRFILE")
        CODE=$?
        set -e
        STDERR=$(cat "$ERRFILE"); rm -f "$ERRFILE"

        # ⛔ SECURITY — `evnx diff --format json` emits RAW SECRET VALUES in
        # `env_value`, with or without --show-values. This action forces json
        # for diff (the exit code is unusable otherwise), so echoing or
        # exporting that output would print production secrets into the workflow
        # log and into `steps.<id>.outputs.result`.
        #
        # ⚠️ v1.1.0 did exactly that. v1.0.1 did not, because it passed an
        # unrecognised format that diff silently downgraded to pretty, which
        # redacts. The fix for the exit code made the leak.
        #
        # Key NAMES are not secret — the server stores them in the clear by
        # design — so the summary below reports names and counts, never values.
        # ⛔ `evnx diff` exits 1 whenever ANY value differs — and a .env.example
        # holds empty placeholders, so a perfectly healthy project always does.
        # Drift is `missing` and `extra`; `different` is what a template looks like.
        if [ "$CMD" = "diff" ]; then
          # ⚠️ One line on purpose: multi-line python inside a YAML block
          # scalar must stay indented or it escapes the scalar, which is a
          # parse error in a file nothing here would otherwise lint.
          DRIFT=$(printf '%s' "$OUTPUT" | python3 -c 'import json,sys; s=json.load(sys.stdin)["summary"]; print(s.get("missing",0)+s.get("extra",0))' 2>/dev/null || echo "parse-error")

          if [ "$DRIFT" = "parse-error" ]; then
            echo "::error::could not read evnx diff output as JSON"
            CODE=2
          elif [ "$DRIFT" -eq 0 ]; then
            CODE=0
          else
            echo "::error::$DRIFT key(s) missing from or extra in $ENV_FILE"
            CODE=1
          fi
          FINDINGS="$DRIFT"

          # ⛔ Replace the raw JSON before anything prints or exports it.
          OUTPUT=$(printf '%s' "$OUTPUT" | python3 -c 'import json,sys; d=json.load(sys.stdin); m=d.get("missing",[]); e=d.get("extra",[]); n=lambda x: x.get("key",x) if isinstance(x,dict) else x; print("missing from .env: " + (", ".join(str(n(k)) for k in m) or "none")); print("not in the example: " + (", ".join(str(n(k)) for k in e) or "none")); print("values differing: %d (names only — evnx never prints values here)" % len(d.get("different",[])))' 2>/dev/null || echo "diff completed")
        fi

        [ -n "$OUTPUT" ] && echo "$OUTPUT"
        [ -n "$STDERR" ] && echo "$STDERR" >&2
        echo "::endgroup::"

        # Findings, for the commands whose JSON we can parse.
        # ⓘ diff set FINDINGS already, above, where the drift is derived.
        if [ "${FINDINGS:-}" = "" ]; then
          FINDINGS=$(printf '%s' "$OUTPUT" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(len(d.get("findings", d.get("errors", []))))' 2>/dev/null || echo 0)
        fi

        {
          echo "exit_code=$CODE"
          echo "findings=$FINDINGS"
          echo "result<<EVNX_EOF"
          echo "$OUTPUT"
          echo "EVNX_EOF"
        } >> "$GITHUB_OUTPUT"

        if [ "$EXIT_ZERO" = "true" ]; then
          exit 0
        fi

        exit $CODE